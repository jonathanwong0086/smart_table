# Alembic configuration file
# Database migration tool configuration

[alembic]
# script directory
script_location = .

# template file name format
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# prepend system path
prepend_sys_path = .

# version path separator
# 'space' works consistently across platforms ('os' differs on Windows/Linux)
version_path_separator = space

# Layered migration version directories (non-existent dirs are skipped by Alembic):
# versions/ = base layer; versions_fa/ = print/field-auth layer;
# versions_am/ = app-mode layer; versions_ap/ = approval-flow layer
# NOTE: for flask_migrate the app/extensions.py configure callback overrides
# this with absolute paths; these relative paths are only used when running
# the alembic CLI manually from inside the migrations directory.
version_locations = versions versions_fa versions_am versions_ap

# database connection URL (read from env)
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# code formatting hooks
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
